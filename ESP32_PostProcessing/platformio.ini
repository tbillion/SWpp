[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.3.11
    greiman/SdFat@^2.2.2

build_flags = 
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=${SD_MISO_PIN}
    -D TFT_MOSI=${TFT_MOSI_PIN}
    -D TFT_SCLK=${TFT_CLK_PIN}
    -D TFT_CS=${TFT_CS_PIN}
    -D TFT_DC=${TFT_DC_PIN}
    -D TFT_RST=${TFT_RST_PIN}
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I include

board_build.partitions = default.csv
